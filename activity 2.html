<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        body {
            background-color: rgb(0, 242, 255);
             font-family: Arial, sans-serif;
        }
        .fact-file {
            background-color: blueviolet;
            color: rgb(0, 229, 255);
            width: 260px;
            padding: 25px;
            border: 4px solid rgb(255, 0, 0);
            margin: 30px;
        }
        .animal-name {
            color: red;
            font-size: 22px;
        }
        .detail {
            color: aquamarine;
        }
        .cool-fact {
            color: azure;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big cat</p>
        <p class="detail">Lives in: Mountain ranges of central asia</p>
        <p class="detail">Diet: Deer, goats, and wild sheep</p>
        <p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump!</p>
    </div>
</body>
</html>
