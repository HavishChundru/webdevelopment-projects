<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Most Powerful kid in Da school</title>
    <style>
        body {
            background-color: rgb(255, 72, 72);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }

        .tagline {
            font-style: italic;
            color: rgb(72, 0, 255);
            text-transform: capitalize;
        }
        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }
        .power {
            font-weight: bold;
            color: rgb(119, 0, 255);
        }

        .weakness {
            text-decoration: line-through;
            color: gray;
        }

        .badge {
            font-size: 36px;
            font-weight: bold;
            color: gold;
            transform: rotate(8.5deg);
            text-shadow: 3px 3px orange;
        }

        .made by {
            color: coral;
            font-style: italic;
        }

    </style>
</head>

<body>
    <h1 class="hero-name">Thunder kid</h1>
    <p class="tagline">The most powerful hero in the school</p>

    <h2 class="label">super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">weaknesses</h2>
    <p class="weakness">Maths Homework</p>
    <p class="weakness">Broccoli</p>
     <br><br><br>
    <p class="badge">Top Hero</p>

    <p class="made by">Created by Havish!</p>
</body>

</html>
